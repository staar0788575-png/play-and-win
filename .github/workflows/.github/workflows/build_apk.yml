name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع من المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة أندرويد لتشغيل فلتر وتجميع الأندرويد
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: '17'

      - name: إعداد وتثبيت إطار عمل فلتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.x'
          channel: 'stable'

      - name: جلب حزم الاعتمادات للمشروع (pubspec.yaml)
        uses: flutter
        run: flutter pub get

      - name: توليد شاشة البداية وأيقونة التطبيق تلقائياً
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons:main

      - name: بناء الإصدار النهائي APK (Release)
        run: flutter build apk --release

      - name: تسهيل تحميل الملف الناتج لرفع ملف الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: play-and-win-release
          path: build/app/outputs/flutter-apk/app-release.apk
