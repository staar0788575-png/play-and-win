name: Build and Deploy Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Flutter Project Structure First
        run: flutter create --org com.example.app --project-name play_and_win --overwrite

      - name: Move Custom Dart Files in lib
        run: |
          mkdir -p lib
          find . -maxdepth 1 -name "*.dart" -exec mv {} lib/ \;

      - name: Get Flutter Packages and Add Firebase Core
        run: |
          flutter pub add firebase_core
          flutter pub get

      - name: Auto-fix minSdkVersion for Firebase
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            echo "Updating minSdkVersion to 23 automatically..."
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' $BUILD_FILE
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' $BUILD_FILE
            sed -i 's/minSdkVersion Flutter.minSdkVersion/minSdkVersion 23/g' $BUILD_FILE
          fi

      - name: Build APK
        run: flutter build apk --release --target=lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
