name: Build and Deploy Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Create Structure and Move Files
        run: |
          mkdir -p lib
          find . -maxdepth 1 -name "*.dart" -exec mv {} lib/ \;

      - name: Recreate Clean Android Directory
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.app --project-name play_and_win

      - name: Fix Kotlin Version for Firebase
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i 's/version "1.8.22"/version "1.9.22"/g' $SETTINGS_FILE
            sed -i 's/version "1.7.10"/version "1.9.22"/g' $SETTINGS_FILE
          fi

      - name: Get Flutter Packages
        run: |
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
