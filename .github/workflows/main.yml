name: Build 9MB Final APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter pub get

      - name: Create and Save Keystore
        run: |
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=PlayAndWin, OU=Dev, O=PlayAndWin, L=Baghdad, S=Baghdad, C=IQ"
          fi
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          # حفظ المفتاح في الريبو عشان يفضل ثابت
          git config user.name "keystore-bot"
          git config user.email "bot@playandwin.com"
          git add android/app/upload-keystore.jks android/key.properties || true
          git commit -m "Save permanent keystore" || true
          git push || true

      - name: Build Release APK arm64 only
        run: flutter build apk --release --split-per-abi

      - name: Upload 9MB APK
        uses: actions/upload-artifact@v4
        with:
          name: play-and-win-9mb
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
