name: Build APK Fixed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0' }
      - run: flutter pub get
      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=PlayAndWin" || true
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - name: Build Release
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: play-and-win-fixed
          path: build/app/outputs/flutter-apk/app-release.apk
