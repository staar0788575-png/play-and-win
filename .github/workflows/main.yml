name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --release
      - run: curl --upload-file build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk https://transfer.sh/app.apk > link.txt && cat link.txt
