name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04 # تم التعديل هنا لحل مشكلة الـ Runner والخوادم[span_2](start_span)[span_2](end_span)
    steps:
      - uses: actions/checkout@v4 # تحديث إلى النسخة الرابعة الأحدث
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true
          
      - run: flutter pub get
      
      - run: flutter build apk --split-per-abi --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk # لرفع جميع النسخ الناتجة بشكل صحيح
